<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URS Mali</title>
<meta name="theme-color" content="#0A6BCF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: console d'opérations URS Store — en-tête au logo, rail d'onglets souligné d'orange, « À traiter » en tête, chiffres clés, puis listes de travail ; chaque saisie s'ouvre dans une feuille. */
:root {
  --bg: #F2F5F9;
  --surface: #FFFFFF;
  --surface-2: #EBF0F6;
  --line: #D8E0EA;
  --ink: #111A27;
  --ink-2: #47546A;
  --ink-3: #738097;
  --accent: #0A6BCF;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2EFFD;
  --brand-blue: #0B7FF0;
  --orange: #F28A12;
  --orange-ink: #A85600;
  --orange-soft: #FEF0DF;
  --good: #1D7A47;
  --good-soft: #E1F2E8;
  --warn: #9B5F0A;
  --warn-soft: #FAEFD8;
  --bad: #B3372A;
  --bad-soft: #FAE4E0;
  --s1: #2a78d6;
  --s2: #eb6834;
  --font-display: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --font-body: "Open Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1119; --surface: #141B26; --surface-2: #1C2533; --line: #293446;
    --ink: #ECF1F8; --ink-2: #B0BCCD; --ink-3: #8290A6;
    --accent: #4DA3FF; --accent-ink: #0C1119; --accent-soft: #15304F;
    --brand-blue: #4DA3FF; --orange: #FFA94D; --orange-ink: #FFB867; --orange-soft: #33230F;
    --good: #4FC486; --good-soft: #13281D; --warn: #E2A64A; --warn-soft: #2C2213;
    --bad: #F07B6B; --bad-soft: #321917;
    --s1: #3987e5; --s2: #d95926;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1119; --surface: #141B26; --surface-2: #1C2533; --line: #293446;
  --ink: #ECF1F8; --ink-2: #B0BCCD; --ink-3: #8290A6;
  --accent: #4DA3FF; --accent-ink: #0C1119; --accent-soft: #15304F;
  --brand-blue: #4DA3FF; --orange: #FFA94D; --orange-ink: #FFB867; --orange-soft: #33230F;
  --good: #4FC486; --good-soft: #13281D; --warn: #E2A64A; --warn-soft: #2C2213;
  --bad: #F07B6B; --bad-soft: #321917;
  --s1: #3987e5; --s2: #d95926;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 17px; font-weight: 700; }
h3 { font-size: 14.5px; font-weight: 700; }
.num, td.n, .kpi .v { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

/* En-tête */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px 6px; max-width: 1080px; margin: 0 auto; }
.emblem { width: 42px; height: 42px; border-radius: 11px; background: #fff; display: grid; place-items: center; flex: none; border: 1px solid var(--line); overflow: hidden; }
.emblem img { width: 36px; height: 36px; display: block; }
.brand { min-width: 0; flex: 1; }
.wordmark { font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: 0.01em; line-height: 1.1; white-space: nowrap; }
.wordmark .u { color: var(--brand-blue); }
.wordmark .s { color: var(--orange); }
.brand p { margin: 0; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip.owner { background: var(--orange-soft); color: var(--orange-ink); }
.chip.coordo { background: var(--accent-soft); color: var(--accent); }
.chip.pending, .chip.muted { background: var(--surface-2); color: var(--ink-3); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 0 10px; max-width: 1080px; margin: 0 auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { flex: none; text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: 14px; padding: 10px 10px 11px; border-bottom: 3px solid transparent; display: inline-flex; align-items: center; gap: 6px; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--orange); }
.count { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: var(--orange); color: #fff; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }

main { max-width: 1080px; margin: 0 auto; padding: 16px 16px 96px; display: grid; gap: 16px; }
.hello { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hello h1 { font-size: 21px; font-weight: 800; }
.hello p { margin: 2px 0 0; color: var(--ink-3); font-size: 13.5px; }

/* Cartes */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card.todo { border-top: 3px solid var(--orange); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card-h p { margin: 0; color: var(--ink-3); font-size: 13px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 820px) { .grid2 { grid-template-columns: 1fr 1fr; } }

.kpis { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 820px) { .kpis.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; min-width: 0; border-left: 4px solid var(--line); align-content: start; }
.kpi.lead { border-left-color: var(--brand-blue); }
.kpi.gold { border-left-color: var(--orange); }
.kpi.warn { border-left-color: var(--warn); }
.kpi.bad { border-left-color: var(--bad); }
.kpi .l { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.kpi .v { font-family: var(--font-display); font-size: 20px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
.kpi .s { font-size: 12.5px; color: var(--ink-2); }
.mini { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 560px) { .mini { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.mini div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.mini .l { font-size: 12px; color: var(--ink-3); }
.mini .v { font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.banner { border-radius: var(--r); padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid; }
.banner.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.banner.info { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 25%, transparent); }
.banner.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.banner p { margin: 0; font-size: 14px; }
.banner strong { display: block; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 14px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ok { background: var(--good); border-color: var(--good); color: #fff; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.small { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-left: 6px; padding-right: 6px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.list { display: grid; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 11px 0; border-top: 1px solid var(--line); align-items: center; }
.item:first-child { border-top: 0; }
.item .t { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.item .m { font-size: 13px; color: var(--ink-3); grid-column: 1; min-width: 0; overflow-wrap: anywhere; }
.item .r { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.item .r small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12px; }
.item .full { grid-column: 1 / -1; }
.item.clickable { cursor: pointer; }
.item.clickable:hover .t { color: var(--accent); }
.quote { grid-column: 1 / -1; background: var(--surface-2); border-left: 3px solid var(--orange); padding: 6px 10px; border-radius: 6px; font-size: 13.5px; color: var(--ink-2); }
.pos { color: var(--good); }
.neg { color: var(--bad); }
.muted { color: var(--ink-3); }
.empty { color: var(--ink-3); font-size: 14px; padding: 6px 0; margin: 0; }

.prod { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: center; cursor: pointer; }
.prod:first-child { border-top: 0; }
.prod .qty { font-family: var(--font-display); font-size: 22px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; line-height: 1; }
.prod .qty small { display: block; font-family: var(--font-body); font-size: 11.5px; font-weight: 600; color: var(--ink-3); margin-top: 3px; }
.prod .name { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.prod .meta { font-size: 13px; color: var(--ink-3); }
.prod:hover .name span:first-child { color: var(--accent); }

.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand-blue); border-radius: 999px; }
.bar i.done { background: var(--good); }
.bar i.over { background: var(--bad); }
.obj { display: grid; gap: 6px; }
.obj .top-line { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; flex-wrap: wrap; }
.obj .top-line b { font-variant-numeric: tabular-nums; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: 12.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); }
td.n, th.n { text-align: right; white-space: nowrap; }
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
.pl td { padding: 9px 4px; }
.pl tr.total td { font-weight: 800; border-bottom: 0; border-top: 2px solid var(--ink); font-size: 15px; }
.pl tr.sub td { font-weight: 700; background: var(--surface-2); }
.pl td:first-child { color: var(--ink-2); }
.pl tr.total td:first-child, .pl tr.sub td:first-child { color: var(--ink); }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 11px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

.steps { display: grid; gap: 8px; }
.step { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); flex-wrap: wrap; }
.step .st { display: flex; gap: 10px; align-items: center; min-width: 0; flex: 1 1 210px; }
.step .ck { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--ink-3); flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.step.done .ck { background: var(--good); border-color: var(--good); color: var(--surface); }
.step.done .lbl { color: var(--ink-3); text-decoration: line-through; }

.switch { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.switch:first-child { border-top: 0; }
.switch span { font-size: 14px; }
.switch input { appearance: none; -webkit-appearance: none; width: 44px; height: 26px; border-radius: 999px; background: var(--line); position: relative; flex: none; cursor: pointer; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: transform .15s; }
.switch input:checked { background: var(--good); }
.switch input:checked::after { transform: translateX(18px); }

/* Feuilles */
.layer { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgb(8 12 20 / .5); }
.layer[hidden] { display: none; }
.sheet { background: var(--surface); width: 100%; max-width: 620px; max-height: 92%; overflow: auto; border-radius: 16px 16px 0 0; padding: 0 16px 20px; display: grid; gap: 14px; align-content: start; }
@media (min-width: 700px) { .layer { align-items: center; } .sheet { border-radius: 16px; max-height: 88%; } }
.sheet-h { position: sticky; top: 0; background: var(--surface); padding: 14px 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); z-index: 2; }
.x { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; flex: none; }
.confirm .sheet { max-width: 420px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.field small { color: var(--ink-3); font-size: 12px; }
input[type="text"], input[type="tel"], input[type="password"], input[type="number"], input[type="date"], input[type="search"], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 15px; min-width: 0; }
input[type="number"] { font-variant-numeric: tabular-nums; }
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.f2 { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.fs { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; margin: 0; min-width: 0; }
.fs legend { font-family: var(--font-display); font-weight: 700; font-size: 14px; padding: 0 6px; }
.fs.pdg { border-color: color-mix(in srgb, var(--orange) 55%, var(--line)); background: color-mix(in srgb, var(--orange-soft) 45%, var(--surface)); }
.line-row { display: grid; grid-template-columns: 1fr 76px 104px 34px; gap: 6px; align-items: start; }
.line-row.ch { grid-template-columns: 1fr 120px 34px; }
.line-row .hint { grid-column: 1 / -1; font-size: 12px; color: var(--ink-3); margin-top: -2px; display: flex; justify-content: space-between; gap: 8px; }
.line-row .hint.warn { color: var(--warn); }
.rm { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; height: 42px; cursor: pointer; color: var(--ink-3); font-size: 18px; }
.sum { background: var(--surface-2); border-radius: var(--r); padding: 12px; display: grid; gap: 6px; }
.sum div { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.sum .big { font-weight: 800; font-size: 16px; border-top: 1px solid var(--line); padding-top: 6px; }
.toggle { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 6px; }
.toggle label { border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center; font-weight: 700; cursor: pointer; position: relative; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.err { color: var(--bad); font-size: 13.5px; margin: 0; }

#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); z-index: 80; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.bad { background: var(--bad); color: #fff; }

.center { display: grid; place-items: center; text-align: center; padding: 28px 16px; gap: 12px; }
.center p { max-width: 46ch; margin: 0; color: var(--ink-2); }
.logo-card { background: #fff; border-radius: 16px; padding: 14px 18px; display: inline-block; }
.logo-card img { width: 220px; max-width: 70vw; height: auto; display: block; }
.small { font-size: 13px; color: var(--ink-3); }
.stale { font-size: 13px; color: var(--warn); margin: 0; }
.chart-wrap { position: relative; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 18px rgb(0 0 0 / .14); min-width: 150px; z-index: 3; }
.tip b { display: block; margin-bottom: 4px; }
.tip div { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
svg text { fill: var(--ink-3); font-size: 11px; font-family: var(--font-body); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.avatar { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-family: var(--font-display); font-size: 14px; cursor: pointer; flex: none; }
.avatar[hidden] { display: none; }
.auth { max-width: 440px; margin: 0 auto; width: 100%; display: grid; gap: 14px; }
.auth .card { gap: 14px; }
.tel-row { display: grid; grid-template-columns: 128px 1fr; gap: 8px; }
.pwd-box { font-family: var(--font-display); font-size: 26px; font-weight: 800; letter-spacing: .04em; text-align: center; background: var(--surface-2); border-radius: 12px; padding: 14px; user-select: all; }
@media (max-width: 480px) {
  .line-row { grid-template-columns: 1fr 1fr 42px; }
  .line-row select { grid-column: 1 / -1; }
  .line-row.ch { grid-template-columns: 1fr 104px 42px; }
  .kpi .v { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { if (v === null || v === undefined || v === "") return 0; const n = Number(String(v).replace(/[\s  ]/g, "").replace(",", ".")); return Number.isFinite(n) ? n : 0; };
const isBlank = v => v === null || v === undefined || String(v).trim() === "";
const F = n => Math.round(num(n)).toLocaleString("fr-FR") + " F";
const NEG = n => (num(n) ? "−" + F(n) : F(0));
const FS = n => (num(n) > 0 ? "+" : num(n) < 0 ? "−" : "") + Math.abs(Math.round(num(n))).toLocaleString("fr-FR") + " F";
const pct = (a, b) => (b > 0 ? (a / b) * 100 : 0);
const fmtPct = x => x.toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " %";
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const dShort = s => parseYmd(s).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });
const dLong = s => parseYmd(s).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const dNum = s => { const [y, m, d] = String(s).split("-"); return d + "/" + m + "/" + y; };
const tShort = iso => { try { const d = new Date(iso); return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) + " à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
const rel = iso => { const s = (Date.now() - new Date(iso).getTime()) / 1000; if (!(s >= 0)) return tShort(iso); if (s < 90) return "à l'instant"; if (s < 3600) return "il y a " + Math.round(s / 60) + " min"; if (s < 86400) return "il y a " + Math.round(s / 3600) + " h"; return "il y a " + Math.round(s / 86400) + " j"; };
const monthsSince = (debut, ref) => { if (!debut) return 1; const a = parseYmd(debut), b = parseYmd(ref); return Math.max(0, (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()) + 1); };
const nowIso = () => new Date().toISOString();
const compact = n => { n = num(n); if (Math.abs(n) >= 1e6) return (n / 1e6).toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " M"; if (Math.abs(n) >= 1e3) return Math.round(n / 1e3).toLocaleString("fr-FR") + " k"; return String(Math.round(n)); };
const plural = (n, s, p) => n + " " + (Math.abs(n) > 1 ? (p || s + "s") : s);

/* ===================== Calculs ===================== */
const ventesOf = j => (Array.isArray(j.ventes) ? j.ventes : []);
const chargesOf = j => (Array.isArray(j.charges) ? j.charges : []);
const caOf = j => ventesOf(j).reduce((s, v) => s + num(v.qte) * num(v.prix), 0);
const coutOf = j => ventesOf(j).reduce((s, v) => s + num(v.qte) * num(v.pa), 0);
const chOf = j => chargesOf(j).reduce((s, c) => s + num(c.montant), 0);
function valOf(j) {
  const v = S.validations.find(x => x.id === j.date);
  if (!v) return { s: "a_valider" };
  if (j.modifieLe && v.le && j.modifieLe > v.le) return { s: "corrigee", v };
  return { s: v.statut === "a_revoir" ? "a_revoir" : "validee", v };
}
const confOf = t => S.confirmations.find(c => c.id === t.id) || null;

function derive() {
  const pmap = new Map(S.produits.map(p => [p.id, p]));
  const stock = new Map(S.produits.map(p => [p.id, num(p.stockInitial)]));
  for (const m of S.mouvements) {
    if (!stock.has(m.produitId)) continue;
    const q = num(m.qte);
    stock.set(m.produitId, stock.get(m.produitId) + (m.type === "sortie" ? -q : q));
  }
  let ca = 0, pub = 0, ch = 0, cout = 0;
  for (const j of S.journal) {
    ca += caOf(j); pub += num(j.pub); ch += chOf(j); cout += coutOf(j);
    for (const v of ventesOf(j)) if (stock.has(v.produitId)) stock.set(v.produitId, stock.get(v.produitId) - num(v.qte));
  }
  let tin = 0, tout = 0, envois = 0;
  for (const t of S.tresorerie) {
    const m = num(t.montant);
    if (t.sens === "entree") tin += m; else tout += m;
    if (t.categorie === "envoi_bf") envois += m;
  }
  const solde = num(S.config.soldeInitial) + ca - pub - ch + tin - tout;
  let unites = 0, valGros = 0, valVente = 0;
  const alertes = [];
  for (const p of S.produits) {
    if (p.actif === false) continue;
    const q = stock.get(p.id) || 0;
    if (q > 0) { unites += q; valGros += q * num(p.prixAchat); valVente += q * num(p.prixVente); }
    if (q <= 0) alertes.push({ p, q, lvl: "bad" });
    else if (q <= num(p.seuil)) alertes.push({ p, q, lvl: "warn" });
  }
  alertes.sort((a, b) => a.q - b.q);
  const t0 = today();
  const eng = new Map();
  let restePayer = 0, resteRecevoir = 0;
  const parType = {};
  for (const e of S.engagements) {
    const du = e.periodicite === "mensuel" ? num(e.montant) * monthsSince(e.debut, t0) : num(e.montant);
    const recevoir = e.type === "creance";
    const paye = S.tresorerie.filter(t => t.engagementId === e.id && t.sens === (recevoir ? "entree" : "sortie")).reduce((s, t) => s + num(t.montant), 0);
    const reste = du - paye;
    eng.set(e.id, { du, paye, reste, recevoir });
    if (e.actif === false) continue;
    if (recevoir) resteRecevoir += Math.max(reste, 0);
    else { restePayer += Math.max(reste, 0); parType[e.type] = (parType[e.type] || 0) + Math.max(reste, 0); }
  }
  let ecart = null;
  const comptes = S.journal.filter(j => !isBlank(j.soldeReel)).sort((a, b) => (a.date < b.date ? 1 : -1));
  if (comptes.length) { const j = comptes[0]; const theo = soldeAu(j.date); ecart = { date: j.date, reel: num(j.soldeReel), theo, diff: num(j.soldeReel) - theo }; }
  // À traiter
  const jSorted = S.journal.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  const aValider = jSorted.filter(j => ["a_valider", "corrigee"].includes(valOf(j).s));
  const aRevoir = jSorted.filter(j => valOf(j).s === "a_revoir");
  const envoisAttente = S.tresorerie.filter(t => t.categorie === "envoi_bf" && !confOf(t)).sort((a, b) => (a.date < b.date ? 1 : -1));
  const envoisRefuses = S.tresorerie.filter(t => t.categorie === "envoi_bf" && (confOf(t) || {}).statut === "non_recu");
  const reapDemandes = S.reappros.filter(r => r.statut === "demande");
  const reapEnvoyes = S.reappros.filter(r => r.statut === "envoye");
  const consAFaire = S.consignes.filter(c => c.statut !== "fait").sort((a, b) => String(a.echeance || "9") < String(b.echeance || "9") ? -1 : 1);
  const consRetard = consAFaire.filter(c => c.echeance && c.echeance < t0);
  const coordoIds = Object.keys(S.config.coordos || {});
  return { pmap, stock, solde, aReverser: cout - envois, envois, unites, valGros, valVente, alertes, eng, restePayer, resteRecevoir, parType, ecart, aValider, aRevoir, envoisAttente, envoisRefuses, reapDemandes, reapEnvoyes, consAFaire, consRetard, coordoIds };
}
function soldeAu(date) {
  let s = num(S.config.soldeInitial);
  for (const j of S.journal) if (j.date <= date) s += caOf(j) - num(j.pub) - chOf(j);
  for (const t of S.tresorerie) if (t.date <= date) s += t.sens === "entree" ? num(t.montant) : -num(t.montant);
  return s;
}
function aggregate(from, to) {
  const A = { ca: 0, cout: 0, pub: 0, chJ: 0, loyer: 0, salaire: 0, achat: 0, autre_dep: 0, envoi_bf: 0, remb_credit: 0, entrees: 0, nbClot: 0, days: new Map(), prods: new Map() };
  for (const j of S.journal) {
    if (j.date < from || j.date > to) continue;
    const ca = caOf(j), pub = num(j.pub), ch = chOf(j);
    A.ca += ca; A.cout += coutOf(j); A.pub += pub; A.chJ += ch; A.nbClot++;
    A.days.set(j.date, { ca, pub, ch, cout: coutOf(j) });
    for (const v of ventesOf(j)) {
      const k = v.produitId || v.nom;
      const cur = A.prods.get(k) || { nom: v.nom || "Produit", qte: 0, ca: 0, marge: 0 };
      cur.qte += num(v.qte); cur.ca += num(v.qte) * num(v.prix); cur.marge += num(v.qte) * (num(v.prix) - num(v.pa));
      A.prods.set(k, cur);
    }
  }
  for (const t of S.tresorerie) {
    if (t.date < from || t.date > to) continue;
    const m = num(t.montant);
    if (t.sens === "entree") { A.entrees += m; continue; }
    if (["loyer", "salaire", "achat", "autre_dep", "envoi_bf", "remb_credit"].includes(t.categorie)) A[t.categorie] += m; else A.autre_dep += m;
  }
  A.marge = A.ca - A.cout;
  A.chargesFixes = A.loyer + A.salaire + A.achat + A.autre_dep;
  A.net = A.marge - A.pub - A.chJ - A.chargesFixes;
  return A;
}
function pubChip(p, ca) {
  if (!(ca > 0)) return `<span class="chip muted">— % du CA</span>`;
  const x = pct(p, ca);
  const max = num((S.config.objectifs || {}).pubMax) || 30;
  const lvl = x <= Math.min(15, max) ? "good" : x <= max ? "warn" : "bad";
  return `<span class="chip ${lvl}" title="Pub maximum fixée : ${max} % du CA"><span class="dot"></span>Pub ${fmtPct(x)} du CA</span>`;
}
function stockChip(p, q) {
  if (p.actif === false) return `<span class="chip muted">Archivé</span>`;
  if (q <= 0) return `<span class="chip bad"><span class="dot"></span>Rupture</span>`;
  if (q <= num(p.seuil)) return `<span class="chip warn"><span class="dot"></span>Stock faible</span>`;
  return `<span class="chip good"><span class="dot"></span>OK</span>`;
}
const valChip = j => { const s = valOf(j).s; const [c, l] = VAL[s]; return `<span class="chip ${c}"><span class="dot"></span>${l}</span>`; };
function confChip(t) {
  const c = confOf(t);
  if (!c) return `<span class="chip warn"><span class="dot"></span>À confirmer par le PDG</span>`;
  return c.statut === "recu" ? `<span class="chip good"><span class="dot"></span>Reçu au Burkina</span>` : `<span class="chip bad"><span class="dot"></span>Pas reçu</span>`;
}

function syncMembres() {

function mapErr(e) {
  const msg = (e && (e.message || e.error_description || e.hint)) || "";
  if (e && (e.code === "42501" || /row-level security|permission denied|Réservé/i.test(msg))) return { code: "invalid_argument", message: msg };
  if (/fetch|network|Failed|timeout/i.test(msg)) return { code: "unavailable", message: msg };
  return { code: "other", message: msg };
}

/* ===================== Écriture ===================== */
async function save(fn, okMsg) {
  const run = async retry => {
    try { await fn(); if (okMsg) toast(okMsg); return true; }
    catch (e) {
      const c = e && e.code;
      if (c === "unavailable" && retry) { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); return run(false); }
      if (c === "invalid_argument") toast("Enregistrement refusé : ton compte n'a pas ce droit.", true);
      else if (c === "quota_exceeded") toast("La base est pleine : " + (e.message || ""), true);
      else if (c === "resource_exhausted") toast("Trop de saisies d'un coup. Réessayez dans quelques secondes.", true);
      else if (c === "revoked") toast("L'accès à cette app a été retiré.", true);
      else if (c === "unavailable") toast("Pas de connexion internet. Réessayez dans un instant.", true);
      else toast("L'enregistrement a échoué" + (e && e.message ? " : " + e.message : ". Réessayez."), true);
      return false;
    }
  };
  return run(true);
}

  return cfgChain;
}

let renderQueued = false;
function scheduleRender() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }
function computeRole() {
  if (S.fatal) { S.role = "none"; return; }
  if (!S.session) { S.role = "auth"; return; }
  if (!S.moiLoaded) { S.role = "loading"; return; }
  const r = S.moi ? S.moi.role : "aucun";
  S.isOwner = r === "pdg";
  S.role = r === "pdg" ? "owner" : r === "coordo" ? "coordo" : (r === "refuse" || r === "retire") ? "blocked" : "pending";
}
function render() {
  computeRole();
  D = derive();
  renderTabs();
  const v = $("#view");
  if (S.fatal) { v.innerHTML = `<div class="center"><span class="logo-card"><img src="${LOGO}" alt="URS Store"></span><h2>Application indisponible</h2><p>${esc(S.fatal)}</p></div>`; return; }
  if (S.role === "auth") { if (!$("#authCard")) v.innerHTML = viewAuth(); return; }
  if (S.role === "loading") { v.innerHTML = `<div class="center"><span class="logo-card"><img src="${LOGO}" alt="URS Store"></span><p>Ouverture de votre compte…</p>${S.stale ? '<p class="stale">Connexion lente. Vérifiez internet.</p>' : ""}</div>`; return; }
  if (S.role === "pending") { v.innerHTML = viewPending(); return; }
  if (S.role === "blocked") { v.innerHTML = viewBlocked(); return; }
  const ready = S.configLoaded && COLLS.every(c => S.loaded.has(c));
  if (!ready) { v.innerHTML = `<div class="center"><span class="logo-card"><img src="${LOGO}" alt="URS Store"></span><p>Chargement des données…</p>${S.stale ? '<p class="stale">Les données ne répondent pas encore. Vérifiez la connexion internet.</p>' : ""}</div>`; return; }
  const cur = currentView();
  const map = { accueil: isPdg() ? viewPdg : viewCoordo, cloture: viewCloture, stock: viewStock, tresorerie: viewTresorerie, engagements: viewEngagements, consignes: viewConsignes, rapports: viewRapports, activite: viewActivite, parametres: viewParametres };
  v.innerHTML = (S.stale ? `<p class="stale">Connexion lente : les chiffres affichés peuvent ne pas être à jour.</p>` : "") + map[cur]();
  if (cur === "rapports") drawReportChart();
  const ids = [];
  for (const c of ["produits", "mouvements", "journal", "tresorerie", "engagements", "consignes", "reappros"]) for (const x of S[c]) { ids.push(x.par); if (x.modifiePar) ids.push(x.modifiePar); if (x.faitPar) ids.push(x.faitPar); }
  ids.push(...Object.keys(S.config.coordos || {}), ...S.demandes.map(d => d.id));
  ensureNames(ids);
}

const authErr = m => { const e = $("#authErr"); if (e) e.textContent = m || ""; };
async function doLogin() {
  authErr("");
  const local = val("lTel").replace(/\D/g, ""), mdp = val("lMdp");
  if (local.length < 8) return authErr("Entrez votre numéro de téléphone.");
  if (!mdp) return authErr("Entrez votre mot de passe.");
  const b = $('[data-act="login"]'); if (b) b.disabled = true;
  try {
    // Le pays choisi d'abord, puis les autres : on se connecte même si l'indicatif n'a pas été changé.
    const choix = val("lPays"); const essais = [choix].concat(PAYS.map(([c]) => c).filter(c => c !== choix));
    let error = null;
    for (const pays of essais) {
      ({ error } = await S.sb.auth.signInWithPassword({ email: telEmail(telDigits(pays, val("lTel"))), password: mdp }));
      if (!error) { try { localStorage.setItem("urs-mali-pays", pays); } catch (e) { /* rien */ } break; }
      if (!/invalid|credentials/i.test(error.message)) break;
    }
    if (error) authErr(/invalid|credentials/i.test(error.message) ? "Numéro ou mot de passe incorrect." : "Connexion impossible. Vérifiez internet et réessayez.");
  } catch (e) { authErr("Connexion impossible. Vérifiez internet et réessayez."); }
  if (b) b.disabled = false;
}
async function doSignup() {
  authErr("");
  const nom = val("sNom").trim(), local = val("sTel").replace(/\D/g, ""), mdp = val("sMdp"), mdp2 = val("sMdp2");
  if (nom.length < 3) return authErr("Entrez votre nom complet.");
  if (local.length < 8) return authErr("Entrez un numéro de téléphone valide.");
  if (mdp.length < 6) return authErr("Le mot de passe doit faire au moins 6 caractères.");
  if (mdp !== mdp2) return authErr("Les deux mots de passe ne sont pas identiques.");
  const digits = telDigits(val("sPays"), val("sTel"));
  const profil = { p_nom: nom, p_tel: telAffiche(digits), p_ville: val("sVille").trim(), p_fonction: val("sFonction").trim() };
  const b = $('[data-act="signup"]'); if (b) b.disabled = true;
  try {
    S.profilEnAttente = profil;
    const { data, error } = await S.sb.auth.signUp({ email: telEmail(digits), password: mdp, options: { data: { nom, tel: profil.p_tel } } });
    if (error) {
      S.profilEnAttente = null;
      if (/already|registered|exists/i.test(error.message)) authErr("Ce numéro a déjà un compte : connectez-vous.");
      else if (/password/i.test(error.message)) authErr("Mot de passe refusé : 6 caractères minimum.");
      else authErr("Création impossible : " + error.message);
    } else if (!data.session) {
      authErr("Compte créé. La connexion automatique n'est pas encore activée : prévenez le PDG.");
    } else {
      await finirInscription();
    }
  } catch (e) { authErr("Création impossible. Vérifiez internet et réessayez."); }
  if (b) b.disabled = false;
}
async function finirInscription() {
  const p = S.profilEnAttente; if (!p || !S.sb || !S.session) return;
  S.profilEnAttente = null;
  const { error } = await S.sb.rpc("s_inscrire", p);
  if (error) toast("Inscription incomplète : ouvrez « Mon compte » et réessayez.", true);
  await loadMembres();
}

function objectifsHtml() {

  const t = today(); const A = aggregate(t.slice(0, 8) + "01", t);
  const d0 = parseYmd(t); const dim = new Date(d0.getFullYear(), d0.getMonth() + 1, 0).getDate();

  const proj = (A.ca / elapsed) * dim;
  const bar = (v, goal, inverse) => { const r = goal > 0 ? v / goal : 0; const w = Math.max(0, Math.min(1, r)) * 100; const cls = inverse ? (r > 1 ? "over" : "done") : (r >= 1 ? "done" : ""); return `<div class="bar"><i class="${cls}" style="width:${w.toFixed(1)}%"></i></div>`; };
  const rows = [];
  if (num(o.ca)) rows.push(`<div class="obj"><div class="top-line"><span>Chiffre d'affaires</span><b>${F(A.ca)} / ${F(o.ca)} · ${fmtPct(pct(A.ca, num(o.ca)))}</b></div>${bar(A.ca, num(o.ca))}<span class="small">Au rythme actuel : ${F(proj)} en fin de mois${proj >= num(o.ca) ? " · objectif atteignable" : " · il manque " + F(num(o.ca) - proj)}</span></div>`);

  if (num(o.benef)) rows.push(`<div class="obj"><div class="top-line"><span>Bénéfice net</span><b>${F(A.net)} / ${F(o.benef)}</b></div>${bar(Math.max(A.net, 0), num(o.benef))}</div>`);

  for (const tr of D.envoisRefuses.filter(x => x.date >= addDays(t, -14))) { const c = confOf(tr) || {}; tasks.push(`<div class="step"><div class="st"><span class="ck">!</span><span>Le PDG n'a pas reçu l'envoi de ${F(tr.montant)} du ${esc(dNum(tr.date))}${c.commentaire ? ` : « ${esc(c.commentaire)} »` : ""}</span></div></div>`); }
  let html = `<div class="hello"><div><h1>Bonjour ${esc((me.nom || who(S.me)).split(" ")[0])}</h1><p>${esc(me.role || "Coordonnateur général")} · URS Store Mali · ${esc(dLong(t))}</p></div></div>`;

  return html;
}

/* ===================== Activité ===================== */
function allEvents() {
  const ev = [];
  for (const j of S.journal) ev.push({ k: "clot", le: j.modifieLe || j.le, par: j.modifiePar || j.par, t: `Clôture du ${dNum(j.date)}${j.modifieLe && j.modifieLe !== j.le ? " (modifiée)" : ""}`, r: F(caOf(j)), date: j.date });
  for (const v of S.validations) ev.push({ k: "val", le: v.le, par: v.par, t: `${v.statut === "a_revoir" ? "Clôture renvoyée à revoir" : "Clôture validée"} : ${dNum(v.id)}`, r: "", m: v.commentaire });
  for (const p of S.produits) ev.push({ k: "stock", le: p.le, par: p.par, t: `Produit ajouté : ${p.nom}`, r: "" });
  for (const m of S.mouvements) { const p = D.pmap.get(m.produitId); ev.push({ k: "stock", le: m.le, par: m.par, t: `${m.type === "entree" ? "Entrée" : m.type === "sortie" ? "Sortie" : "Inventaire"} de stock : ${p ? p.nom : "produit"}`, r: (m.type === "sortie" ? "−" : num(m.qte) > 0 ? "+" : "") + Math.abs(num(m.qte)), m: m.motif }); }
  for (const r of S.reappros) { ev.push({ k: "stock", le: r.le, par: r.par, t: `Demande de stock : ${r.qte} × ${r.nom}`, r: "" }); if (r.envoyeLe) ev.push({ k: "stock", le: r.envoyeLe, par: r.envoyePar, t: `Stock envoyé : ${r.qteEnvoyee} × ${r.nom}`, r: "" }); if (r.recuLe) ev.push({ k: "stock", le: r.recuLe, par: r.recuPar, t: `Stock reçu au Mali : ${r.qteRecue} × ${r.nom}`, r: "" }); }
  for (const t of S.tresorerie) ev.push({ k: "caisse", le: t.le, par: t.par, t: catLabel(t.categorie), r: (t.sens === "entree" ? "+" : "−") + F(t.montant), m: t.motif });
  for (const c of S.confirmations) { const t = S.tresorerie.find(x => x.id === c.id); ev.push({ k: "caisse", le: c.le, par: c.par, t: `Envoi ${c.statut === "recu" ? "confirmé reçu" : "signalé non reçu"}${t ? " : " + F(t.montant) : ""}`, r: "", m: c.commentaire }); }
  for (const e of S.engagements) ev.push({ k: "eng", le: e.le, par: e.par, t: `Engagement ajouté : ${e.libelle}`, r: "" });
  for (const c of S.consignes) { ev.push({ k: "cons", le: c.le, par: c.par, t: `Consigne donnée : ${c.texte}`, r: "" }); if (c.faitLe) ev.push({ k: "cons", le: c.faitLe, par: c.faitPar, t: `Consigne faite : ${c.texte}`, r: "", m: c.reponse }); }
  return ev.filter(e => e.le).sort((a, b) => (String(a.le) < String(b.le) ? 1 : -1));
}

const activityHtml = n => evHtml(allEvents().slice(0, n));
function viewActivite() {

}

/* ===================== Trésorerie ===================== */
function moneyLines() {
  const L = [];
  for (const j of S.journal) { const ca = caOf(j), pub = num(j.pub), ch = chOf(j); L.push({ date: j.date, le: j.le, kind: "clot", id: j.id, montant: ca - pub - ch, t: "Clôture du jour", m: `CA +${F(ca)} · Pub −${F(pub)} · Charges −${F(ch)}`, par: j.modifiePar || j.par }); }
  for (const t of S.tresorerie) { const e = t.engagementId ? S.engagements.find(x => x.id === t.engagementId) : null; L.push({ date: t.date, le: t.le, kind: "treso", id: t.id, tr: t, montant: t.sens === "entree" ? num(t.montant) : -num(t.montant), t: catLabel(t.categorie), m: [t.motif, e ? "Engagement : " + e.libelle : ""].filter(Boolean).join(" · "), par: t.par }); }
  L.sort((a, b) => (a.date === b.date ? (String(a.le) < String(b.le) ? -1 : 1) : a.date < b.date ? -1 : 1));
  let run = num(S.config.soldeInitial);
  for (const l of L) { run += l.montant; l.solde = run; }
  return L.reverse();
}

function repRange() {
  const t = today(), r = S.rep;
  if (r.mode === "jour") return [t, t, "Aujourd'hui"];
  if (r.mode === "7j") return [addDays(t, -6), t, "7 derniers jours"];
  if (r.mode === "moisPrec") { const d = parseYmd(t); d.setDate(1); d.setDate(0); const end = ymd(d); return [end.slice(0, 8) + "01", end, d.toLocaleDateString("fr-FR", { month: "long", year: "numeric" })]; }
  if (r.mode === "perso") { const f = r.from || addDays(t, -29), to = r.to || t; return f <= to ? [f, to, "Du " + dNum(f) + " au " + dNum(to)] : [to, f, "Du " + dNum(to) + " au " + dNum(f)]; }
  return [t.slice(0, 8) + "01", t, parseYmd(t).toLocaleDateString("fr-FR", { month: "long", year: "numeric" })];
}

      <div class="kpi"><span class="l">Marge brute</span><span class="v">${F(A.marge)}</span><span class="s">${A.ca > 0 ? fmtPct(pct(A.marge, A.ca)) + " du CA" : "—"}</span></div>

function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; const n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10; return n * p; }
function topRounded(x, y, w, h, r) { r = Math.min(r, w / 2, h); if (h <= 0) return ""; return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
function drawReportChart() {
  const el = $("#chart"); if (!el) return;
  let [from, to] = repRange();
  if (Math.round((parseYmd(to) - parseYmd(from)) / 864e5) > 61) from = addDays(to, -61);
  const A = aggregate(from, to);
  const days = []; for (let d = from; d <= to; d = addDays(d, 1)) { const x = A.days.get(d) || { ca: 0, pub: 0 }; days.push({ d, ca: x.ca, pub: x.pub, has: A.days.has(d) }); }
  if (!days.some(x => x.has)) { el.innerHTML = `<p class="empty">Pas encore de clôture sur cette période.</p>`; return; }
  const W = Math.max(300, el.clientWidth || 600), H = 220, m = { l: 48, r: 6, t: 10, b: 26 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const max = niceMax(Math.max(...days.map(x => Math.max(x.ca, x.pub))));
  const y = v => m.t + ph - (v / max) * ph;
  const n = days.length, gw = pw / n;
  const bw = Math.max(2, Math.min(16, (gw - 6) / 2));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Chiffre d'affaires et pub par jour">`;
  for (let i = 0; i <= 4; i++) { const v = (max / 4) * i, yy = y(v); s += `<line x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1" ${i ? 'stroke-dasharray="2 3"' : ""}/><text x="${m.l - 6}" y="${yy + 4}" text-anchor="end">${compact(v)}</text>`; }
  const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(pw / 48))));
  days.forEach((x, i) => {
    const cx = m.l + gw * i + gw / 2;
    if (x.ca > 0) s += `<path d="${topRounded(cx - bw - 1, y(x.ca), bw, m.t + ph - y(x.ca), 4)}" fill="var(--s1)"/>`;
    if (x.pub > 0) s += `<path d="${topRounded(cx + 1, y(x.pub), bw, m.t + ph - y(x.pub), 4)}" fill="var(--s2)"/>`;
    if (i % every === 0 || i === n - 1) { const p = parseYmd(x.d); s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${p.getDate()}/${p.getMonth() + 1}</text>`; }
  });
  s += `</svg><div class="tip" id="tip" hidden></div>`;
  el.innerHTML = s;
  const svg = el.querySelector("svg"), tip = $("#tip");
  const move = ev => {
    const r = svg.getBoundingClientRect(); const sx = (ev.clientX - r.left) * (W / r.width);
    const i = Math.floor((sx - m.l) / gw); if (i < 0 || i >= n) { tip.hidden = true; return; }
    const x = days[i];
    tip.innerHTML = `<b>${esc(dShort(x.d))}</b>${x.has ? `<div><span>CA</span><span>${F(x.ca)}</span></div><div><span>Pub</span><span>${F(x.pub)}</span></div><div><span>% pub</span><span>${x.ca > 0 ? fmtPct(pct(x.pub, x.ca)) : "—"}</span></div>` : `<div><span class="muted">Pas de clôture</span></div>`}`;
    tip.hidden = false;
    const left = ((m.l + gw * i + gw / 2) / W) * r.width;
    tip.style.left = Math.min(Math.max(0, left - 80), r.width - 170) + "px"; tip.style.top = "0px";
  };
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", () => { tip.hidden = true; });
}

function cfAvail(pid, rowIndex) {
  const base = (D.stock.get(pid) || 0) + (CF.ex ? ventesOf(CF.ex).filter(v => v.produitId === pid).reduce((s, v) => s + num(v.qte), 0) : 0);
  const others = CF.ventes.reduce((s, v, i) => s + (i !== rowIndex && v.produitId === pid ? num(v.qte) : 0), 0);
  return base - others;
}
function renderCfRows() {

  $("#cfVentes").innerHTML = CF.ventes.map((v, i) => `<div class="line-row">
      <select data-f="v-prod" data-i="${i}" aria-label="Produit" ${ro ? "disabled" : ""}>${prodOptions(v.produitId, v.produitId)}${v.produitId && !D.pmap.has(v.produitId) ? `<option value="${esc(v.produitId)}" selected>${esc(v.nom || "Produit supprimé")}</option>` : ""}</select>

  $("#cfCharges").innerHTML = CF.charges.length ? CF.charges.map((c, i) => `<div class="line-row ch">

      <input type="number" inputmode="numeric" min="0" step="1" placeholder="Montant" aria-label="Montant" data-f="c-montant" data-i="${i}" value="${esc(c.montant)}" ${ro ? "disabled" : ""}>
      <button class="rm" data-act="cf-rm-charge" data-i="${i}" aria-label="Retirer cette charge" ${ro ? "disabled" : ""}>×</button></div>`).join("") : `<p class="empty" style="padding:0">Aucune autre charge.</p>`;
}
function updateCf() {
  if (!CF) return;
  let ca = 0, cout = 0;
  CF.ventes.forEach((v, i) => {
    const st = num(v.qte) * num(v.prix); ca += st; cout += num(v.qte) * num(v.pa);
    const h = document.getElementById("cfHint" + i); if (!h) return;
    if (!v.produitId) { h.className = "hint"; h.textContent = ""; return; }
    const av = cfAvail(v.produitId, i); const over = num(v.qte) > av;
    h.className = "hint" + (over ? " warn" : "");
    h.innerHTML = `<span>${over ? "Stock insuffisant : " : "Disponible : "}${av.toLocaleString("fr-FR")}</span><span>${st ? F(st) : ""}</span>`;
  });
  const pub = num(CF.pub), ch = CF.charges.reduce((s, c) => s + num(c.montant), 0);
  const res = ca - cout - pub - ch;
  $("#cfSum").innerHTML = `<div><span>Chiffre d'affaires</span><span>${F(ca)}</span></div>
    <div><span>Coût des produits (prix de gros)</span><span>${NEG(cout)}</span></div>
    <div><span>Pub</span><span>${NEG(pub)} ${ca > 0 ? `<span class="muted">(${fmtPct(pct(pub, ca))})</span>` : ""}</span></div>
    <div><span>Autres charges</span><span>${NEG(ch)}</span></div>
    <div class="big"><span>Marge du jour</span><span class="${res < 0 ? "neg" : ""}">${F(res)}</span></div>`;
  const hint = $("#cfSoldeHint");
  if (hint) {
    if (isBlank(CF.soldeReel)) hint.textContent = "Permet de détecter un écart entre l'argent réel et les saisies.";
    else {
      const prev = soldeAu(CF.date) - (CF.ex ? caOf(CF.ex) - num(CF.ex.pub) - chOf(CF.ex) : 0);
      const theo = prev + ca - pub - ch; const diff = num(CF.soldeReel) - theo;
      hint.innerHTML = Math.abs(diff) < 1 ? `<span class="pos">Caisse juste : ${F(theo)} attendus.</span>` : `<span class="neg">Écart ${FS(diff)} : ${F(theo)} attendus d'après les saisies.</span>`;
    }
  }
}
async function saveCloture() {
  setErr("");
  const date = CF.date;
  if (!date || date > today()) return setErr("Choisissez un jour valide (pas dans le futur).");
  const lines = CF.ventes.filter(v => v.produitId || !isBlank(v.qte) || !isBlank(v.prix));
  for (const v of lines) {
    if (!v.produitId) return setErr("Choisissez le produit pour chaque ligne de vente.");
    if (!(num(v.qte) > 0) || !Number.isInteger(num(v.qte))) return setErr("La quantité vendue doit être un nombre entier supérieur à 0.");
    if (num(v.prix) < 0) return setErr("Le prix ne peut pas être négatif.");
  }
  const charges = CF.charges.filter(c => !isBlank(c.motif) || !isBlank(c.montant)).map(c => ({ motif: String(c.motif || "Charge").trim(), montant: num(c.montant) }));
  if (charges.some(c => c.montant < 0) || num(CF.pub) < 0) return setErr("Les montants ne peuvent pas être négatifs.");
  if (!lines.length && !num(CF.pub) && !charges.length && isBlank(CF.soldeReel)) return setErr("Rien à enregistrer : ajoutez au moins une vente, la pub ou une charge.");
  const ventes = lines.map(v => { const p = D.pmap.get(v.produitId); return { produitId: v.produitId, nom: p ? p.nom : (v.nom || "Produit"), qte: num(v.qte), prix: num(v.prix), pa: !isBlank(v.pa) ? num(v.pa) : num(p && p.prixAchat) }; });
  const ex = S.journal.find(j => j.date === date);
  const doc = { date, ventes, ca: ventes.reduce((s, v) => s + v.qte * v.prix, 0), pub: num(CF.pub), charges, soldeReel: isBlank(CF.soldeReel) ? null : num(CF.soldeReel), note: String(CF.note || "").trim(), par: ex ? ex.par : S.me, le: ex ? ex.le : nowIso(), modifiePar: S.me, modifieLe: nowIso() };
  const btn = $('[data-act="cf-save"]'); if (btn) btn.disabled = true;
  const ok = await save(() => S.db.doc("journal/" + date).set(doc), "Clôture du " + dNum(date) + " enregistrée");
  if (ok) closeSheet(); else if (btn) btn.disabled = false;
}

/* ===================== Base de données (Supabase) ===================== */
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
function makeDb(sb) {
  const cache = {}, subs = {}, timers = {};
  const meta = { fromCache: false, hasPendingWrites: false };
  const emit = col => (subs[col] || []).forEach(s => { try { s.next(); } catch (e) { console.error(e); } });
  async function fetchCol(col) {
    const out = new Map(); const step = 1000;
    for (let from = 0; ; from += step) {
      const { data, error } = await sb.from("docs").select("id,data").eq("collection", col).range(from, from + step - 1);
      if (error) throw mapErr(error);
      (data || []).forEach(r => out.set(r.id, r.data));
      if (!data || data.length < step) break;
    }
    cache[col] = out; emit(col);
  }
  const refresh = col => {
    clearTimeout(timers[col]);
    timers[col] = setTimeout(() => fetchCol(col).catch(e => (subs[col] || []).forEach(s => s.err && s.err(e))), 120);
  };
  const local = (col, id, data) => { if (!cache[col]) cache[col] = new Map(); if (data === null) cache[col].delete(id); else cache[col].set(id, data); emit(col); };
  try {
    sb.channel("docs-sync").on("postgres_changes", { event: "*", schema: "public", table: "docs" }, p => {
      const r = (p.new && p.new.collection) ? p.new : p.old;
      if (!r || !r.collection || !subs[r.collection]) return;
      if (p.eventType === "DELETE") local(r.collection, r.id, null);
      else if (r.data) local(r.collection, r.id, r.data);
      else refresh(r.collection);
    }).subscribe();
  } catch (e) { /* le rafraîchissement régulier prend le relais */ }
  const refreshAll = () => Object.keys(subs).forEach(refresh);
  setInterval(refreshAll, 45000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshAll(); });
  window.addEventListener("online", refreshAll);
  function listen(col, next, err) {
    (subs[col] = subs[col] || []).push({ next, err });
    if (cache[col]) setTimeout(next, 0); else refresh(col);
    return () => {};
  }
  function doc(path) {
    const [col, id] = path.split("/");
    const ref = {
      id, path,
      async get() { const d = cache[col] && cache[col].get(id); return { id, exists: !!d, data: () => d, metadata: meta }; },
      async set(data) {
        const body = JSON.parse(JSON.stringify(data));
        const { error } = await sb.from("docs").upsert({ collection: col, id, data: body, maj_le: new Date().toISOString() });
        if (error) throw mapErr(error);
        local(col, id, body);
      },
      async update(patch) {
        let cur = cache[col] && cache[col].get(id);
        if (!cur) {
          const { data, error } = await sb.from("docs").select("data").eq("collection", col).eq("id", id).maybeSingle();
          if (error) throw mapErr(error);
          if (!data) throw { code: "other", message: "élément introuvable" };
          cur = data.data;
        }
        return ref.set(Object.assign({}, cur, patch));
      },
      async delete() {
        const { error } = await sb.from("docs").delete().eq("collection", col).eq("id", id);
        if (error) throw mapErr(error);
        local(col, id, null);
      },
      onSnapshot(next, err) { return listen(col, () => { const d = cache[col] && cache[col].get(id); next({ id, exists: !!d, data: () => d, metadata: meta }); }, err); },
    };
    return ref;
  }
  function collection(col) {
    return {
      path: col,
      doc: id => doc(col + "/" + (id || newId())),
      add: async data => { const r = doc(col + "/" + newId()); await r.set(data); return r; },
      onSnapshot(next, err) {
        return listen(col, () => {
          const docs = [...(cache[col] || new Map()).entries()].map(([id, d]) => ({ id, exists: true, data: () => d, metadata: meta }));
          next({ docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: meta });
        }, err);
      },
    };
  }
  return { doc, collection, refreshAll };
}

/* ===================== Démarrage ===================== */
let dataStarted = false, membresChan = null;
async function loadMembres() {
  if (!S.sb || !S.session) return;
  try {
    const { data, error } = await S.sb.from("membres").select("*");
    if (error) throw error;
    S.membres = data || []; S.moiLoaded = true; S.stale = false;
    syncMembres(); computeRole();
    if ((S.role === "owner" || S.role === "coordo") && !dataStarted) startData();
  } catch (e) { S.stale = true; }
  scheduleRender();
}
function startData() {
  dataStarted = true;
  const timer = setTimeout(() => { S.stale = true; scheduleRender(); }, 12000);
  const settle = () => { if (S.configLoaded && COLLS.every(c => S.loaded.has(c))) { clearTimeout(timer); S.stale = false; } };
  const onErr = e => { if (e && e.code === "invalid_argument") { loadMembres(); } else S.stale = true; scheduleRender(); };
  S.db.doc("config/main").onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    S.config = { soldeInitial: num(d && d.soldeInitial), dateDebut: (d && d.dateDebut) || null, coordos: {}, droits: (d && d.droits) || {}, objectifs: (d && d.objectifs) || {} };
    syncMembres(); S.configLoaded = true; settle(); scheduleRender();
  }, onErr);
  for (const c of COLLS) {
    S.db.collection(c).onSnapshot(snap => {
      S[c] = snap.docs.filter(d => d.exists).map(d => Object.assign({}, d.data(), { id: d.id }));
      if (c === "journal") S.journal.forEach(j => { if (!j.date) j.date = j.id; });
      S.loaded.add(c); settle(); scheduleRender();
    }, onErr);
  }
}
async function onSession(session) {
  const prev = S.me;
  S.session = session || null; S.me = session ? session.user.id : null;
  if (!session) { S.moi = null; S.moiLoaded = false; S.membres = []; scheduleRender(); return; }
  if (prev !== S.me || !S.moiLoaded) {
    if (S.profilEnAttente) await finirInscription(); else await loadMembres();
    if (!membresChan) {
      try { membresChan = S.sb.channel("membres-sync").on("postgres_changes", { event: "*", schema: "public", table: "membres" }, () => loadMembres()).subscribe(); } catch (e) { /* rafraîchissement régulier */ }
    }
  }
  scheduleRender();
}
async function init() {
  render();
  if (!window.supabase || !CFG.url || !CFG.cle) { S.fatal = "L'application est en cours d'installation. Réessayez dans quelques minutes."; return render(); }
  const sb = window.supabase.createClient(CFG.url, CFG.cle, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "urs-mali-auth" } });
  S.sb = sb; S.db = makeDb(sb);
  sb.auth.onAuthStateChange((ev, session) => { setTimeout(() => onSession(session), 0); });
  try { const { data } = await sb.auth.getSession(); await onSession(data.session); } catch (e) { S.stale = true; render(); }
  setInterval(() => { if (S.session) loadMembres(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.session) loadMembres(); });
}
init();
</script>
